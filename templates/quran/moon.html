<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@1,500&family=Alexandria:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000}
  svg{position:absolute;inset:0}
  #lab{position:absolute;top:110px;left:0;right:0;text-align:center;font-family:"Amiri",serif;font-size:30px;color:#cfd6e6;letter-spacing:1px}
  #box{position:absolute;left:46px;right:46px;top:700px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
  #ar{font-family:"Amiri Quran","Amiri",serif;font-size:60px;line-height:1.9;color:#fff}
  #en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:30px;color:#aab3c5;margin-top:6px;direction:ltr;line-height:1.3}
  #wm{position:absolute;top:1010px;left:0;right:0;text-align:center;font-family:"Alexandria",sans-serif;font-size:20px;color:#fff;opacity:.4;direction:ltr}
</style></head>
<body>
<svg viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9fb4ff" stop-opacity=".22"/><stop offset="1" stop-color="#9fb4ff" stop-opacity="0"/></radialGradient>
    <mask id="cres"><rect width="720" height="1280" fill="#000"/><circle cx="360" cy="420" r="120" fill="#fff"/><circle id="cut" cx="404" cy="396" r="112" fill="#000"/></mask>
    <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe9"/><stop offset="1" stop-color="#d9d2b8"/></linearGradient>
  </defs>
  <g id="stars" fill="#fff"></g>
  <circle id="haloC" cx="360" cy="420" r="300" fill="url(#halo)"/>
  <g id="bars" stroke="#cfd9ff" stroke-linecap="round"></g>
  <circle cx="360" cy="420" r="120" fill="url(#moonG)" mask="url(#cres)"/>
</svg>
<div id="lab"></div>
<div id="box"><div id="ar"></div><div id="en"></div></div>
<div id="wm">__WM__</div>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)}, prog=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=i=>{const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)};
const DATA=__DATA__, D=DATA.D, IT=DATA.items, RMS=DATA.rms;
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
const ST=[];for(let i=0;i<120;i++)ST.push(el('circle',{cx:rnd(i)*720,cy:rnd(i+77)*1280,r:.4+rnd(i+3)*1.3},$('stars')));
const N=72, BR=[];for(let i=0;i<N;i++)BR.push(el('line',{'stroke-width':3},$('bars')));
let cur=-1;
function seek(t){
  const f=Math.min(RMS.length-1,Math.max(0,Math.round(t*30))), lv=RMS[f];
  ST.forEach((s,i)=>s.setAttribute('opacity',.15+.45*(.5+.5*Math.sin(t*1.2+i*1.7))));
  BR.forEach((b,i)=>{const a=i/N*Math.PI*2-Math.PI/2;
    const h=6+lv*(40+30*Math.abs(Math.sin(i*1.9+t*3)))*(.6+.4*rnd(i+f%7));
    const r0=150, r1=r0+h;
    b.setAttribute('x1',360+r0*Math.cos(a)); b.setAttribute('y1',420+r0*Math.sin(a));
    b.setAttribute('x2',360+r1*Math.cos(a)); b.setAttribute('y2',420+r1*Math.sin(a));
    b.setAttribute('opacity',.25+.6*lv)});
  $('haloC').setAttribute('r',260+80*lv);
  $('cut').setAttribute('cx',404+6*Math.sin(t*.3));
  let i=-1; for(let j=0;j<IT.length;j++) if(t>=IT[j].s-0.15) i=j;
  if(i!==cur){cur=i; if(i>=0){$('ar').textContent=IT[i].text; $('en').textContent=IT[i].en; $('lab').textContent=IT[i].sura;}}
  const lk=ease(prog(t,0,.8)); $('lab').style.opacity=lk;
  $('wm').style.opacity=.4*ease(prog(t,.3,1));
  if(i>=0){const it=IT[i], nx=i+1<IT.length?IT[i+1].s-0.15:D+1;
    const kin=ease(prog(t,it.s-0.15,it.s+0.4)), kout=1-ease(prog(t,nx-0.3,nx)), k=Math.min(kin,kout);
    $('ar').style.opacity=k; $('ar').style.transform=`scale(${.96+.04*kin})`;
    const ek=Math.min(ease(prog(t,it.s+0.2,it.s+0.7)),kout); $('en').style.opacity=ek; $('en').style.transform=`translateY(${(1-ek)*10}px)`;
  } else {$('ar').style.opacity=0;$('en').style.opacity=0;}
}
window.seek=seek; window.DURATION=D;
seek(new URLSearchParams(location.search).get('t')*1||8);
</script>
</body></html>
