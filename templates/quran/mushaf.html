<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Alexandria:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#2b2116}
  body{position:relative;background:radial-gradient(ellipse 600px 800px at 50% 45%,#3a2c1c 0%,#1d150d 100%)}
  #page{position:absolute;left:36px;right:36px;top:120px;height:860px;border-radius:10px;
        background:radial-gradient(ellipse at 50% 40%,#fbf3df 0%,#f1e3c2 70%,#e6d2a8 100%);
        box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 0 60px rgba(150,110,50,.25);transform-origin:50% 50%}
  #f1{position:absolute;inset:14px;border:3px solid #1f4d3a;border-radius:6px}
  #f2{position:absolute;inset:22px;border:1.5px solid #b8933f;border-radius:4px}
  .corner{position:absolute;width:34px;height:34px;border:2px solid #b8933f;transform:rotate(45deg);background:#f4e7c6}
  #head{position:absolute;top:44px;left:60px;right:60px;height:62px;border-radius:31px;background:#1f4d3a;border:2.5px solid #b8933f;
        display:flex;align-items:center;justify-content:center;font-family:"Amiri",serif;font-weight:700;font-size:36px;color:#f4e2b0}
  #bas{position:absolute;top:124px;left:0;right:0;text-align:center;font-family:"Amiri Quran","Amiri",serif;font-size:40px;color:#2b2116}
  #body{position:absolute;top:200px;left:50px;right:50px;font-family:"Amiri Quran","Amiri",serif;font-size:37px;line-height:2.2;
        color:#2b2116;text-align:justify;text-align-last:center}
  #body span.a{transition:none;border-radius:10px;padding:0 4px}
  .m{font-family:"Amiri",serif;color:#1f4d3a;font-size:32px}
  #rec{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-family:"Amiri",serif;font-size:24px;color:#6b5434}
  #wm{position:absolute;top:1000px;left:0;right:0;text-align:center;font-family:"Alexandria",sans-serif;font-size:20px;color:#f1e3c2;opacity:.5;direction:ltr}
</style></head>
<body>
<div id="page">
  <div id="f1"></div><div id="f2"></div>
  <div class="corner" style="top:-3px;left:-3px"></div><div class="corner" style="top:-3px;right:-3px"></div>
  <div class="corner" style="bottom:-3px;left:-3px"></div><div class="corner" style="bottom:-3px;right:-3px"></div>
  <div id="head">__SURA__</div>
  <div id="bas"></div>
  <div id="body"></div>
  <div id="rec">__REC__</div>
</div>
<div id="wm">__WM__</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)}, prog=(t,a,b)=>clamp((t-a)/(b-a));
const DATA=__DATA__, D=DATA.D, IT=DATA.items;
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
$('bas').textContent=IT[0].text;
const SP=IT.slice(1).map(it=>{const s=document.createElement('span');s.className='a';
  s.innerHTML=it.text+' <span class="m">﴿'+ar(it.num)+'﴾</span> ';$('body').appendChild(s);return s});
function seek(t){
  const pk=ease(prog(t,0,.9));
  $('page').style.opacity=pk; $('page').style.transform=`translateY(${(1-pk)*30}px) scale(${1+0.03*prog(t,0,D)})`;
  $('wm').style.opacity=.5*ease(prog(t,.4,1.2));
  let i=-1; for(let j=0;j<IT.length;j++) if(t>=IT[j].s-0.1) i=j;
  $('bas').style.color=i===0?'#1f4d3a':'#2b2116';
  $('bas').style.textShadow=i===0?'0 0 18px rgba(184,147,63,.55)':'none';
  SP.forEach((s,j)=>{const idx=j+1;
    if(idx===i){const k=ease(prog(t,IT[idx].s-0.1,IT[idx].s+0.35));
      s.style.color='#1f4d3a'; s.style.opacity=.35+.65*k;
      s.style.background=`rgba(214,180,95,${.38*k})`; s.style.boxShadow=`0 0 0 4px rgba(214,180,95,${.38*k})`;}
    else {s.style.color='#2b2116'; s.style.opacity=idx<i?1:.32; s.style.background='transparent'; s.style.boxShadow='none';}
  });
}
window.seek=seek; window.DURATION=D;
seek(new URLSearchParams(location.search).get('t')*1||10);
</script>
</body></html>
