<!doctype html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Alexandria:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#05080f}
  body{position:relative;color:#f6ecd8}
  svg{position:absolute;inset:0}
  .head{position:absolute;top:96px;left:0;right:0;text-align:center}
  .sura{font-family:"Amiri",serif;font-weight:700;font-size:44px;color:#e2c27a}
  .rec{font-family:"Alexandria",sans-serif;font-size:19px;color:#b9ad97;margin-top:6px;opacity:.85}
  .orn{width:220px;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#e2c27a,transparent)}
  #ayah{position:absolute;left:50px;right:50px;top:0;height:1280px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
  #txt{font-family:"Amiri Quran","Amiri",serif;font-size:66px;line-height:2.0;color:#f8efdc;text-shadow:0 0 24px rgba(226,194,122,.25)}
  #num{font-family:"Amiri",serif;font-size:40px;color:#e2c27a;margin-top:6px}
  #dots{position:absolute;top:930px;left:0;right:0;display:flex;justify-content:center;gap:10px;direction:rtl}
  #dots i{width:8px;height:8px;border-radius:50%;background:#e2c27a;opacity:.25;display:block;box-shadow:0 0 6px rgba(0,0,0,.8)}
  #wm{position:absolute;top:985px;left:0;right:0;text-align:center;font-family:"Alexandria",sans-serif;font-size:20px;color:#f6ecd8;opacity:.45;direction:ltr;text-shadow:0 1px 6px rgba(0,0,0,.7)}
</style></head>
<body>
<svg viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04070f"/><stop offset=".6" stop-color="#0b1426"/><stop offset="1" stop-color="#15203a"/></linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2140"/><stop offset=".45" stop-color="#4a3a5e"/><stop offset=".8" stop-color="#c47a55"/><stop offset="1" stop-color="#f0b56e"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03100f"/><stop offset=".6" stop-color="#0a2226"/><stop offset="1" stop-color="#0f2e30"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f3d58c" stop-opacity=".55"/><stop offset=".45" stop-color="#e2c27a" stop-opacity=".18"/><stop offset="1" stop-color="#e2c27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff1c9"/><stop offset=".35" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb05a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
  </defs>
  <rect id="bgA" width="720" height="1280"/>
  <rect id="bgB" width="720" height="1280" opacity="0"/>
  <g id="stars" fill="#fff"></g>
  <circle id="sunC" cx="360" r="300" fill="url(#sun)" opacity="0"/>
  <circle id="glowC" cx="360" cy="640" r="200" fill="url(#glow)"/>
  <g id="parts" fill="#f3d58c"></g>
  <rect width="720" height="1280" fill="url(#vig)"/>
</svg>
<div class="head" id="head"><div class="sura">__SURA__</div><div class="rec">__REC__</div><div class="orn"></div></div>
<div id="ayah"><div id="txt"></div><div id="num"></div></div>
<div id="dots"></div>
<div id="wm">__WM__</div>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, prog=(t,a,b)=>clamp((t-a)/(b-a)), lerp=(a,b,k)=>a+(b-a)*k;
const rnd=i=>{const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)};
const DATA=__DATA__, D=DATA.D, THEME=DATA.theme, IT=DATA.items;
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
if(THEME==='duha'){$('bgA').setAttribute('fill','url(#night)');$('bgB').setAttribute('fill','url(#dawn)');}
else {$('bgA').setAttribute('fill','url(#teal)');}
const ST=[];for(let i=0;i<70;i++)ST.push(el('circle',{cx:rnd(i)*720,cy:rnd(i+99)*900,r:.6+rnd(i+7)*1.6},$('stars')));
IT.forEach(it=>{if(it.num){const d=document.createElement('i');$('dots').appendChild(d);it.dot=d}});
let cur=-1;
function seek(t){
  const p=prog(t,0,D);
  // header + watermark
  const hk=ease(prog(t,0,.8)); $('head').style.opacity=hk; $('head').style.transform=`translateY(${(1-hk)*-14}px)`;
  $('wm').style.opacity=.45*ease(prog(t,.3,1));
  // background
  if(THEME==='duha'){
    const d=inout(prog(t,D*.15,D*.95));
    $('bgB').setAttribute('opacity',d);
    ST.forEach((s,i)=>s.setAttribute('opacity',(1-d)*(.35+.35*Math.sin(t*1.5+i))));
    $('sunC').setAttribute('cy',lerp(1520,1230,d)); $('sunC').setAttribute('opacity',d*.75);
    $('glowC').setAttribute('r',160+20*Math.sin(t*.8)); $('glowC').setAttribute('opacity',.35*(1-d)+.15);
  } else {
    ST.forEach((s,i)=>s.setAttribute('opacity',.18+.18*Math.sin(t*1.3+i)));
    const yu=IT.find(x=>x.num===5), yuS=yu?yu.s:D*.5;
    const r=lerp(140,360,inout(prog(t,0,D)))+40*ease(prog(t,yuS,yuS+3))+12*Math.sin(t*.9);
    $('glowC').setAttribute('r',r); $('glowC').setAttribute('opacity',.75+.25*ease(prog(t,yuS,yuS+3)));
  }
  // drifting light particles
  const P=$('parts'); P.innerHTML='';
  for(let i=0;i<26;i++){const sp=.012+rnd(i+5)*.02, ph=(t*sp+rnd(i))%1;
    el('circle',{cx:rnd(i+31)*720+10*Math.sin(t*.5+i),cy:1280-ph*1380,r:1+rnd(i+3)*2.2,opacity:.12+.3*Math.sin(Math.PI*ph)},P)}
  // ayah text
  let i=-1; for(let j=0;j<IT.length;j++) if(t>=IT[j].s-0.15) i=j;
  if(i!==cur){cur=i; if(i>=0){$('txt').textContent=IT[i].text; $('num').textContent=IT[i].num?'﴿'+ar(IT[i].num)+'﴾':'';}}
  if(i>=0){const it=IT[i], nx=i+1<IT.length?IT[i+1].s-0.15:D+1;
    const kin=ease(prog(t,it.s-0.15,it.s+0.45)), kout=1-ease(prog(t,nx-0.35,nx));
    const k=Math.min(kin,kout);
    $('ayah').style.opacity=k; $('ayah').style.transform=`translateY(${(1-kin)*16}px)`; $('ayah').style.filter=`blur(${(1-k)*6}px)`;}
  else $('ayah').style.opacity=0;
  IT.forEach((it,j)=>{if(it.dot)it.dot.style.opacity=j<=i?1:.25});
}
window.seek=seek; window.DURATION=D;
seek(new URLSearchParams(location.search).get('t')*1||3);
</script>
</body></html>
